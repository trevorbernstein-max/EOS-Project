<div id="headliner">

<div class="upload-container">

        </label>
        <input type="file" id="imagePicker" class="hidden-file-input" accept="image/*">
    </div>





<input id="desctxt" type="text" placeholder="Enter description here...">



<!-- https://stackoverflow.com/questions/76684999/how-can-i-make-a-drop-down-menu-in-html -->

<div id="typeslc" >

        <select name="features">
        <option value="problem-default">...</option>
        <option value="problem1">Infrastructure</option>
        <option value="problem2">Lighting</option>
        <option value="problem3">Cleaning</option>
